bluesea_node:
  ros__parameters:
    frame_id: "laser"
    scan_topic: "scan"
    cloud_topic: "cloud"

    dev_id: -1
    raw_bytes: 3
    output_360: true
    output_scan: true
    output_cloud2: false
    with_angle_filter: false
    min_angle: -3.1415926
    max_angle: 3.1415926

    hard_resample: false
    soft_resample: false
    with_checksum: false
    reversed: false
    min_dist: 0.1
    max_dist: 50.0
    error_circle: 3
    error_scale: 0.9

    type: "uart"
    port: "/dev/ttyUSB0"
    baud_rate: 500000

    uuid: -1

    resample_res: 0.5
    with_confidence: 1
    with_smooth: -1
    with_deshadow: -1
    alarm_msg: 0
    rpm: -1